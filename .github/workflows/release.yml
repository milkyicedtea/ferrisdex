name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Add ARM target only for macOS
      - name: Add macOS ARM target
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      # Build binaries
      - name: Build release
        shell: bash
        run: |
          cargo build --release

          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            cargo build --release --target aarch64-apple-darwin
          fi

      # Package per OS
      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist release

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/release/ferrisdex.exe dist/ferrisdex-windows-x86_64.exe

          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Create universal binary
            lipo -create \
              target/release/ferrisdex \
              target/aarch64-apple-darwin/release/ferrisdex \
              -output dist/ferrisdex

            strip dist/ferrisdex || true
            chmod +x dist/ferrisdex

            cp dist/ferrisdex release/
            tar czf dist/ferrisdex-macos-universal.tar.gz -C release ferrisdex

          else
            # Linux
            cp target/release/ferrisdex dist/ferrisdex

            strip dist/ferrisdex
            chmod +x dist/ferrisdex

            cp dist/ferrisdex release/
            tar czf dist/ferrisdex-linux-x86_64.tar.gz -C release ferrisdex
          fi

      # Upload to GitHub Release
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ferrisdex-linux-x86_64.tar.gz
            dist/ferrisdex-macos-universal.tar.gz
            dist/ferrisdex-windows-x86_64.exe